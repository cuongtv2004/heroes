name: Build & deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Chỉ cho phép một lần deploy tại một thời điểm. Không hủy lần đang chạy —
# để một deploy dở dang không làm site hỏng.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài dependency
        run: pip install -r requirements.txt

      - name: Kiểm toàn vẹn Codex
        # Cửa chặn: site không được build từ Codex có lỗi cấu trúc.
        run: python3 tools/check.py

      - name: Chuyển [[wikilink]] sang liên kết Markdown
        # Sinh _build/ từ docs/. MkDocs đọc _build, không đọc docs trực tiếp.
        run: python3 tools/wikilinks.py --build

      - name: Build site
        run: mkdocs build --strict

      - name: Kiểm render
        # Bắt markup lọt ra ngoài dưới dạng chữ thô. `mkdocs build` KHÔNG bắt
        # được loại lỗi này — icon Material từng hiện thành chữ trên site thật
        # mà build vẫn báo thành công.
        run: python3 tools/lint_site.py --strict

      # Deploy bằng cách đẩy _site/ sang nhánh gh-pages.
      #
      # VÌ SAO KHÔNG DÙNG actions/deploy-pages: repo đang ở chế độ Pages
      # `build_type: legacy`, nên GitHub chạy workflow Jekyll mặc định
      # (`pages-build-deployment`) SONG SONG và nó thắng — kết quả là trang chủ
      # hiện README.md do Jekyll render, còn mọi trang con 404.
      #
      # Đổi setting đó cần quyền admin mà token CI không có. Nhưng khi nhánh
      # `gh-pages` tồn tại, GitHub ưu tiên phục vụ từ đó. `.nojekyll` trong
      # nhánh này chặn Jekyll xử lý tiếp.
      - name: Deploy sang gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          enable_jekyll: false
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
